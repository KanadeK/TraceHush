[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tracehush"
version = "0.1.0"
description = "Offline Playwright trace privacy preflight and text redaction CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Vesper" }]
keywords = ["playwright", "trace", "security", "privacy", "redaction", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
]

[project.scripts]
tracehush = "tracehush.cli:main"

[project.urls]
Homepage = "https://github.com/KanadeK/TraceHush"
Issues = "https://github.com/KanadeK/TraceHush/issues"
Changelog = "https://github.com/KanadeK/TraceHush/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/tracehush"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
